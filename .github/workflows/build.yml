name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@main

      # x86: EventGhost is a 32-bit process, so the DLL it loads must match.
      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Check exports
        shell: pwsh
        run: |
          # Located by search rather than a fixed path: the runner's Visual
          # Studio major version changes without notice.
          $dumpbin = Get-ChildItem -Recurse -Filter dumpbin.exe `
            "C:\Program Files\Microsoft Visual Studio", `
            "C:\Program Files (x86)\Microsoft Visual Studio" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          # Joined into one string on purpose: -notmatch against an array
          # returns the non-matching elements, which is truthy almost always.
          $out = (& $dumpbin.FullName /exports build\Release\egsmtc.dll) -join "`n"
          $out
          foreach ($name in 'smtc_now_playing','smtc_sessions','smtc_control','smtc_thumbnail','smtc_last_error') {
            # Anchored so a decorated _name@8 export cannot satisfy the check;
            # ctypes resolves by exact name.
            if ($out -notmatch "(?m)^\s+\d+\s+\w+\s+\w+\s+$name\s*$") {
              throw "missing or decorated export: $name"
            }
          }

      # Proves the DLL actually loads and answers. A runner has no media
      # session, so the smoke test accepts "no session" as a pass and only
      # fails on a crash, a hang or an unexpected code.
      - name: Smoke test
        # Bounded so a hang fails in a minute instead of occupying a runner
        # until the job limit. A hang is exactly what this step exists to
        # catch, so it must not be able to hang the job.
        timeout-minutes: 1
        run: build\Release\smoke.exe
        working-directory: ${{ github.workspace }}
        env:
          PATH: ${{ github.workspace }}\build\Release;${{ env.PATH }}

      # The plugin is Python 2 only, so py_compile on the runner's interpreter
      # cannot check it. parso is pinned because 0.8 dropped the 2.7 grammar
      # and later versions raise NotImplementedError for it.
      - name: Check plugin syntax
        run: |
          python -m pip install --quiet "parso==0.7.1"
          python tools/check_py2.py

      - name: Stage plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\SMTC | Out-Null
          Copy-Item plugin\* dist\SMTC -Recurse
          Copy-Item build\Release\egsmtc.dll dist\SMTC

      - uses: actions/upload-artifact@main
        with:
          name: SMTC-plugin
          path: dist/SMTC

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SMTC -DestinationPath SMTC-plugin.zip
          gh release create "${env:GITHUB_REF_NAME}" SMTC-plugin.zip `
            --title "${env:GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
